    <h1>
        <body onload="startTime()">

            <div id="txt"></div>

            <script>

                function startTime() {
                    const today = new Date();
                    let h = today.getHours();
                    let m = today.getMinutes();
                    let s = today.getSeconds();
                    m = checkTime(m);
                    s = checkTime(s);
                    document.getElementById('txt').innerHTML = h + ":" + m + ":" + s;
                    setTimeout(startTime, 1000);
                }

                function checkTime(i) {
                    if (i < 10) { i = "0" + i };  // add zero in front of numbers < 10
                    return i;
                }
            </script>

    </h1>

<button onclick="playSequence()">Play Announcement</button>

<script>
let currentIndex = 0;
    const audio = new Audio();
    let tracks = [];

    function playSequence() {
        tracks = [
            document.getElementById("bell").value,
            document.getElementById("message").value,
            document.getElementById("airline").value,
            document.getElementById("action").value,
            document.getElementById("flight1").value,
            document.getElementById("flight2").value,
            document.getElementById("flight3").value
        ];

        currentIndex = 0;
        audio.src = tracks[currentIndex];
        audio.play();
    }

    audio.addEventListener("ended", () => {
        currentIndex++;
        if (currentIndex < tracks.length) {
            audio.src = tracks[currentIndex];
            audio.play();
        }
    });
</script>
